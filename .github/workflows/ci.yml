name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/syspkg
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Exercise the authoring workflow
        run: |
          ./syspkg validate examples/hello/recipe.json
          ./syspkg pack --recipe examples/hello/recipe.json --output "$RUNNER_TEMP/package" --blob message=examples/hello/message.txt
          ./syspkg inspect "$RUNNER_TEMP/package"
